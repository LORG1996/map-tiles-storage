<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture Landing</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #232845;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        z-index: 0;
      }

      /* Flex UI Overlay */
      .ui-overlay {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px;
        pointer-events: none;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: auto;
      }

      .logo {
        color: #ffffff;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .badge {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        letter-spacing: 1px;
      }

      .content-box {
        max-width: 550px;
        pointer-events: auto;
        background: rgba(35, 40, 69, 0.65);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      h1 {
        color: #ffffff;
        font-size: 2.75rem;
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 16px;
        letter-spacing: -0.5px;
      }

      p {
        color: rgba(255, 255, 255, 0.75);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .btn-container {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .explore-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1a1e35;
        padding: 14px 28px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
      }

      .explore-btn:hover {
        background: #e0e4f0;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
      }

      .info-tags {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .tag-item span {
        display: block;
      }

      .tag-label {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .tag-value {
        font-size: 0.95rem;
        color: #ffffff;
        font-weight: 600;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="ui-overlay">
      <header>
        <div class="logo">Sasha Liudkevych</div>
        <div class="badge">Architecture 3D</div>
      </header>

      <div class="content-box">
        <h1>GLB model</h1>
        <p>
          High quality realtime visualization of your architecture
        </p>
        
        <div class="btn-container">
          <a href="https://www.instagram.com/sasha_ludkevych/" target="_blank" class="explore-btn">
            My instagram →
          </a>
        </div>

        
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { EXRLoader } from "three/addons/loaders/EXRLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      // Сцена
      const scene = new THREE.Scene();

      // Камера
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        10000
      );
      camera.position.set(8, 6, 12);

      // Рендерер
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      document.body.appendChild(renderer.domElement);

      const interiorMeshes = [];
      const mouse = new THREE.Vector2(-1000, -1000);
      const tempVector = new THREE.Vector3();

      window.addEventListener("mousemove", (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      });

      // Постобробка
      const composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);

      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.2,   
        0.5,   
        0.75   
      );
      composer.addPass(bloomPass);

      // Контроли
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Генератор середовища
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      new EXRLoader().load(
        './glb_export/environment.exr',
        (texture) => {
          const envMap = pmremGenerator.fromEquirectangular(texture).texture;
          
          scene.environment = envMap; 
          scene.environmentIntensity = 0.8; // Збільшено силу відблисків на матеріалах

          scene.background = envMap;
          scene.backgroundIntensity = 0.1;  

          texture.dispose();
          pmremGenerator.dispose();
        },
        undefined,
        (error) => {
          console.error("Failed to load EXR environment map:", error);
        }
      );

      function createNoiseTexture(uvMultiplier = 100) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#808080';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const noise = (Math.random() - 0.5) * 40;
          data[i]     = 128 + noise;
          data[i + 1] = 128 + noise;
          data[i + 2] = 128 + noise;
        }
        ctx.putImageData(imgData, 0, 0);

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(uvMultiplier, uvMultiplier); 
        return texture;
      }

      // Матеріал скла
      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xF5ffff,
        metalness: 0.1,
        roughness: 0.05,       
        transmission: 0.9,     
        thickness: 1.5,        
        ior: 1.5,              
        envMapIntensity: 2.0,  
        bumpMap: createNoiseTexture(0.015), 
        bumpScale: 2,       
        transparent: true,
        opacity: 1.0,
        depthWrite: false      
      });

      function frameObject(object) {
        const box = new THREE.Box3().setFromObject(object);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const fitDist = maxDim / (2 * Math.tan((camera.fov * Math.PI) / 360));

        camera.near = Math.max(fitDist / 100, 0.01);
        camera.far = fitDist * 100;
        camera.updateProjectionMatrix();
        camera.position.copy(center).add(new THREE.Vector3(1, 0.6, 1).normalize().multiplyScalar(fitDist * 1.6));
        camera.lookAt(center);
        controls.target.copy(center);
        controls.update();
      }

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath(
        "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/"
      );

      const loader = new GLTFLoader();
      loader.setDRACOLoader(dracoLoader);
      loader.load(
        "./glb_export/Architecture_landing.glb",
        (gltf) => {
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.material) {
              const meshName = child.name.toLowerCase();

              if (meshName.includes("glass") || meshName.includes("window")) {
                child.material = glassMaterial;
              } 
              else if (meshName.includes("interior") || meshName.includes("room") || meshName.includes("light")) {
                const mat = child.material.clone();
                
                const hue = 1 + Math.random() * 0.2; 
                const saturation = 0.3 + Math.random() * 0.5; 
                const value = 0.5 + Math.random() * 0.5; 
                
                const randomColor = new THREE.Color().setHSL(hue, saturation, value);

                mat.emissive = randomColor;
                const baseIntensity = 0.3 + Math.random() * 1;
                mat.emissiveIntensity = baseIntensity;
                
                child.material = mat;

                interiorMeshes.push({
                  mesh: child,
                  material: mat,
                  baseIntensity: baseIntensity
                });
              } 
              else {
                // Використовуємо MeshStandardMaterial замість MeshBasicMaterial, 
                // щоб об'єкти реагували на світло та рефлекси з EXR оточення
                const oldMat = child.material;
                child.material = new THREE.MeshStandardMaterial({
                  map: oldMat.map || null,
                  color: oldMat.color || new THREE.Color(0xffffff),
                  roughness: 0.6, // Налаштування шорсткості для гарних відблисків
                  metalness: 0.1, // Легкий металевий відтінок за потреби
                  envMapIntensity: 1.0
                });
              }
            }
          });

          scene.add(gltf.scene);
          frameObject(gltf.scene);
        },
        undefined,
        (error) => {
          console.error("Failed to load GLB:", error);
        }
      );

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }

      window.addEventListener("resize", onResize);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        interiorMeshes.forEach((item) => {
          item.mesh.getWorldPosition(tempVector);
          tempVector.project(camera);

          let targetIntensity = item.baseIntensity;
          if (tempVector.z < 1) {
            const dx = tempVector.x - mouse.x;
            const dy = tempVector.y - mouse.y;
            const screenDist = Math.sqrt(dx * dx + dy * dy);
            
            const cursorRadius = 0.25; 

            if (screenDist < cursorRadius) {
              const factor = 1 - (screenDist / cursorRadius);
              targetIntensity += factor * 10.0; 
            }
          }

          item.material.emissiveIntensity = THREE.MathUtils.lerp(
            item.material.emissiveIntensity,
            targetIntensity,
            0.1
          );
        });

        composer.render();
      }

      animate();
    </script>
  </body>
</html>
