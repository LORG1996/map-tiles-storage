<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Перенаправлення у jwmaps...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 340px;
            width: 100%;
        }
        h2 { margin-top: 0; font-size: 20px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .btn {
            display: block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            box-sizing: border-box;
        }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="card">
    <h2>📍 Перехід до території</h2>
    <p id="info-text">Зачекайте, відкриваємо додаток...</p>
    
    <!-- Ручна кнопка рятує, якщо мобільний браузер блокує автоматичний редирект -->
    <a id="open-app-btn" href="#" class="btn">Відкрити в додатку</a>
</div>

<script>
    // Отримуємо параметр town з URL (наприклад, ?town=dubravka)
    const urlParams = new URLSearchParams(window.location.search);
    const town = urlParams.get('town') || 'berezhnytsia';

    const infoText = document.getElementById('info-text');
    const openAppBtn = document.getElementById('open-app-btn');

    infoText.innerText = `Територія: ${town}`;

    const isAndroid = /android/i.test(navigator.userAgent);
    let finalRedirectUrl = `jwmaps://?town=${encodeURIComponent(town)}`;

    if (isAndroid) {
        // Використовуємо ваш реальний appId з capacitor.config.json: com.sasha.jwmaps
        const packageName = "com.sasha.jwmaps"; 
        finalRedirectUrl = `intent://?town=${encodeURIComponent(town)}#Intent;scheme=jwmaps;package=${packageName};end`;
    }

    // Прив'язуємо посилання до кнопки
    openAppBtn.href = finalRedirectUrl;

    // Пробуємо зробити автоматичний редирект
    setTimeout(() => {
        try {
            window.location.href = finalRedirectUrl;
        } catch (e) {
            console.log("Автоматичний редирект заблоковано:", e);
        }
    }, 400);
</script>

</body>
</html>
