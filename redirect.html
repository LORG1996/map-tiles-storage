<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відкриття jwmaps...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #f8fafc;
            color: #1e293b;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>📍 jwmaps</h3>
        <p id="status" style="color: #64748b; font-weight: bold; font-size: 16px; margin-bottom: 20px;">Завантаження території...</p>
        
        <!-- Робимо кнопку основною дією, яку легко натиснути -->
        <a id="open-btn" class="btn" href="#">Відкрити у додатку</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let town = urlParams.get('town');

        if (!town || town.trim() === "") {
            town = 'berezhnytsia';
        }

        town = town.trim().toLowerCase();

        const appSchema = `jwmaps://?town=${encodeURIComponent(town)}`;

        // Показуємо назву території користувачу
        document.getElementById('status').innerText = `Територія: ${town}`;

        const btn = document.getElementById('open-btn');
        btn.setAttribute('href', appSchema);

        // Робимо так, щоб при кліку на будь-яке місце або саму кнопку редирект спрацьовував на 100%
        btn.onclick = function(e) {
            // Даємо браузеру зрозуміти, що це пряма дія користувача
            window.location.href = appSchema;
        };

        // Робимо плавня спробу авто-переходу (якщо браузер дозволить)
        window.onload = function() {
            setTimeout(() => {
                // Використовуємо location.href замість replace, це іноді краще сприймається WebView
                window.location.href = appSchema;
            }, 300);
        };
    </script>
</body>
</html>
