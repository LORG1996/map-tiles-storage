<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відкриття jwmaps...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f8fafc;
            color: #1e293b;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>📍 jwmaps</h3>
        <p id="status">Відкриваємо територію в додатку...</p>
        <a id="open-btn" class="btn" href="#">Відкрити вручну</a>
    </div>

    <script>
        // Читаємо назву села з URL (наприклад: ?town=berezhnytsia)
        const urlParams = new URLSearchParams(window.location.search);
        const town = urlParams.get('town') || 'berezhnytsia';

        // Формуємо глибоке посилання на додаток
        const appSchema = `jwmaps://open?town=${town}`;

        // Оновлюємо кнопку для ручного натискання
        document.getElementById('open-btn').setAttribute('href', appSchema);
        document.getElementById('status').innerText = `Перенаправляємо на територію: ${town}`;

        // Автоматичний редирект у додаток
        window.location.href = appSchema;
    </script>
</body>
</html>
